name: Validate Build and Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Restore, build, and test MAUI client
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows --ignore-failed-sources

      - name: Restore dependencies
        run: dotnet restore KBUI_Explorer.csproj

      - name: Build Windows target
        run: dotnet build KBUI_Explorer.csproj -f net9.0-windows10.0.19041.0 --configuration Release --no-restore

      - name: Run test project
        run: dotnet test tests/KBUI_Explorer.Tests/KBUI_Explorer.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kbui-test-results
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 3
