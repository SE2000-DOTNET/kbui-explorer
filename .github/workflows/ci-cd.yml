name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Reject bundled API keys
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("KBUI_Web/wwwroot/appsettings.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          key = (data.get("QueryUi") or {}).get("ApiKey") or ""
          if str(key).strip():
              raise SystemExit("QueryUi:ApiKey must be empty in KBUI_Web/wwwroot/appsettings.json")
          print("QueryUi:ApiKey is empty")
          PY

      - name: Restore dependencies
        run: dotnet restore KBUI_Web/KBUI_Web.csproj

      - name: Publish Blazor WebAssembly app
        run: dotnet publish KBUI_Web/KBUI_Web.csproj -c Release --no-restore -o ./site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/wwwroot

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
