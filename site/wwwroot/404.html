<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>Redirecting...</title>
    <script>
        const redirect = sessionStorage.getItem('redirectTo') || './';
        sessionStorage.setItem('redirectTo', redirect);
        window.location.replace('./');
    </script>
</head>

<body>
    <p>Redirecting to the app...</p>
</body>

</html>
